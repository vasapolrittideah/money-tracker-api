services:
  # Primary MongoDB instance running as a single-node replica set (rs0).
  # A replica set is required to support multi-document transactions.
  # The keyfile is copied to /tmp at startup so its ownership can be fixed
  # to the 'mongodb' user, which mongod requires before it will accept the file.
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
      MONGO_INITDB_DATABASE: ${DB_NAME}
    volumes:
      - mongodb_data:/data/db
      - ./mongo-keyfile:/etc/mongo-keyfile:ro
    networks:
      - backend
    entrypoint: >
      bash -c "cp /etc/mongo-keyfile /tmp/mongo-keyfile &&
               chmod 400 /tmp/mongo-keyfile &&
               chown mongodb:mongodb /tmp/mongo-keyfile &&
               exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /tmp/mongo-keyfile"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # One-shot container that initialises the replica set by calling rs.initiate().
  # It runs only after the mongodb healthcheck passes, then exits and is never restarted.
  # Without this step mongod starts in replica-set mode but has no elected primary,
  # so reads/writes and transactions would all fail.
  mongo-init:
    image: mongo:7
    container_name: mongo-init
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend
    env_file:
      - .env
    entrypoint: >
      mongosh --host mongodb -u ${DB_USER} -p ${DB_PASSWORD} --authenticationDatabase admin --eval
      "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]})"
    restart: "no"

  # The Go API server. It waits for mongodb to pass its healthcheck before
  # starting, guaranteeing a primary is available when the app first connects.
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    container_name: money-tracker-api
    ports:
      - "5050:5050"
    volumes:
      - .:/app
    working_dir: /app
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - backend

volumes:
  mongodb_data:

networks:
  backend:
